name: AHIF van Steijn 2026 twenty-species original field source audit

on:
  push:
    branches: [analysis/ahif-db-v1-20261124]
    paths:
      - ".github/workflows/knk-ahif-vansteijn2026-field.yml"
      - "benchmarks/probe_ahif_vansteijn2026_field.py"
      - "benchmarks/audit_ahif_vansteijn2026_grain.py"
      - "benchmarks/score_ahif_vansteijn2026_field.py"
      - "tests/test_ahif_vansteijn2026_field.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-zenodo-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query public Zenodo original 20-species field experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vansteijn2026"
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          import os
          url="https://zenodo.org/api/records/15363824"
          req=urllib.request.Request(url,headers={
              "User-Agent":"AHIF-DB-public-academic-source-audit/0.2",
              "Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=90) as res:
              data=json.load(res)
          v=data.get("metadata",{})
          print("SOURCE_RECORD",json.dumps({
             "id":data.get("id"),"doi":data.get("doi"),
             "title":v.get("title"),"published":v.get("publication_date"),
             "files":[{"name":f.get("key"),"size":f.get("size"),"checksum":f.get("checksum"),
                       "url":f.get("links",{}).get("self")}
                      for f in data.get("files",[])],
          },ensure_ascii=False))
          output=Path(os.environ["RUNNER_TEMP"])/"vansteijn2026"/"zenodo_source_manifest.json"
          output.write_text(json.dumps({"record_id":data.get("id"),"doi":data.get("doi"),
              "title":v.get("title"),"published":v.get("publication_date"),
              "files":[{"name":f.get("key"),"size":f.get("size"),
                        "checksum":f.get("checksum")} for f in data.get("files",[])],
              "status":"SOURCE_MANIFEST_ONLY_NOT_SCORED"},
              indent=2,ensure_ascii=False)+"\n")
          if data.get("id")!=15363824 or len(data.get("files",[]))<1:
              raise SystemExit("Source metadata incomplete, don't infer content")
          PY
      - name: Original seven source files, year/plot/species grain
        shell: bash
        run: |
          python -m benchmarks.probe_ahif_vansteijn2026_field \
            --outdir "$RUNNER_TEMP/vansteijn2026"
      - name: Audit original 40 whole-plot treatment and repeated species point-survey grain
        shell: bash
        run: |
          python -m benchmarks.audit_ahif_vansteijn2026_grain \
            --source-dir "$RUNNER_TEMP/vansteijn2026" \
            --output "$RUNNER_TEMP/vansteijn2026/plot_grain_audit.json"
      - name: Test source-free randomized-block and repeated-plot estimates
        shell: bash
        run: |
          python -m pip install numpy pytest
          python -m pytest tests/test_ahif_vansteijn2026_field.py -q
      - name: Score all 40 plots across 4 years with source-locked blocked permutations
        shell: bash
        run: |
          python -m benchmarks.score_ahif_vansteijn2026_field \
            --original-dir "$RUNNER_TEMP/vansteijn2026" \
            --out "$RUNNER_TEMP/vansteijn2026/ahif_field_named_rank_results.json" \
            --permutations 9999 \
            --bootstrap 2000
      - name: Archive derived source audits and history/rank SCORES only
        uses: actions/upload-artifact@v4
        with:
          name: ahif-2026-plants-field-source-manifest
          path: |
            ${{ runner.temp }}/vansteijn2026/zenodo_source_manifest.json
            ${{ runner.temp }}/vansteijn2026/original_field_schema.json
            ${{ runner.temp }}/vansteijn2026/plot_grain_audit.json
            ${{ runner.temp }}/vansteijn2026/ahif_field_named_rank_results.json
          retention-days: 14
