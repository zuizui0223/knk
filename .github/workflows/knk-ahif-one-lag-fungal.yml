name: AHIF fungal one-lag transfer
on:
  push:
    branches: [analysis/ahif-one-lag-fungal-20261125]
    paths:
      - ".github/workflows/knk-ahif-one-lag-fungal.yml"
      - "benchmarks/score_ahif_one_lag_fungal.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic tests
        run: |
          python -m pip install numpy scipy openpyxl pytest
          python -m pytest tests/test_ahif_cross_source_concentration.py -q
      - name: Acquire original source files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/poem" "$RUNNER_TEMP/field"
          curl --fail --location --retry 2 --retry-delay 4 --max-time 180 "https://zenodo.org/records/10119982/files/POEMexperiment/Data_POEM_Paper1_Alonso-Crespo_et_al_2024-v1.0.zip?download=1" -o "$RUNNER_TEMP/poem/source.zip"
          echo "3faa5f7d1619a3beae5941ba763b7a26  $RUNNER_TEMP/poem/source.zip" | md5sum -c -
          python - <<'PY'
          import hashlib,os,urllib.request
          from pathlib import Path
          from urllib.parse import quote
          from benchmarks.probe_ahif_vansteijn2026_field import MD5
          root=Path(os.environ["RUNNER_TEMP"])/"field"
          for name,md5 in MD5.items():
              req=urllib.request.Request("https://zenodo.org/records/15363824/files/"+quote(name)+"?download=1",headers={"User-Agent":"AHIF source audit","Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=90) as res:
                  b=res.read(2_000_001)
              assert len(b)<=2_000_000 and hashlib.md5(b).hexdigest()==md5
              (root/name).write_bytes(b)
          PY
      - name: Acquire versioned independent microbial source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mancuso"
          for n in 1 2; do
            curl --fail --location --max-time 60 "https://cdn.elifesciences.org/articles/67175/elife-67175-fig3-data${n}-v2.csv" -o "$RUNNER_TEMP/mancuso/data${n}.csv"
          done
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Download pinned fungal data and original author methods
        run: |
          python - <<'PY'
          import hashlib,os,urllib.request
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"saine"
          root.mkdir(exist_ok=True)
          for name,md5 in {"data_meta_otu.Rdata":"4dbc27f81ffdcf1925887c7e0805b031","S2_define_HMSC_models_and_export_to_Hmsc-HPC.R":"a3dfe8ae32340e470a31cfa7bac7f9dd"}.items():
              req=urllib.request.Request("https://zenodo.org/records/13819389/files/"+name+"?download=1",headers={"User-Agent":"AHIF-DB source audit","Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=90) as res:
                  b=res.read(2_000_001)
              assert len(b)<=2_000_000 and hashlib.md5(b).hexdigest()==md5
              (root/name).write_bytes(b)
          PY
      - name: Verify and export original fungal OTU data
        run: Rscript benchmarks/export_ahif_saine2025_nontarget.R "$RUNNER_TEMP/saine" "$RUNNER_TEMP/saine/ephemeral"
      - name: Harmonize prior sources and score held fungal logs and sites
        run: python -m benchmarks.score_ahif_one_lag_fungal --mancuso "$RUNNER_TEMP/mancuso" --root "$RUNNER_TEMP/kansas" --poem "$RUNNER_TEMP/poem/source.zip" --field "$RUNNER_TEMP/field" --fungal "$RUNNER_TEMP/saine/ephemeral" --out "$RUNNER_TEMP/one-lag/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ahif-one-lag-fungal-derived-only
          path: ${{ runner.temp }}/one-lag/result.json
          retention-days: 30
