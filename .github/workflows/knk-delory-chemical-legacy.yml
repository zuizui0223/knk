name: KNK independent chemical niche-modification audit

on:
  push:
    branches: [analysis/interaction-formation-20261123]
    paths:
      - ".github/workflows/knk-delory-chemical-legacy.yml"
      - "benchmarks/score_delory_chemical_legacy.py"
      - "tests/test_delory_chemical_legacy.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-verified-chemical-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical test dependencies
        run: python -m pip install numpy pytest
      - name: Source-free test of chemical legacy estimator
        run: python -m pytest tests/test_delory_chemical_legacy.py -q
      - name: Fetch pinned PUBLIC original 60 plant observations (ephemeral only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delory"
          URL="https://raw.githubusercontent.com/BenjaminDelory/Rhizometabolome_2020/v1.0.0/data/Data_plants.csv"
          curl --fail --location --retry 3 --retry-delay 4 --max-time 120 "$URL" -o "$RUNNER_TEMP/delory/Data_plants.csv"
          test "$(git hash-object "$RUNNER_TEMP/delory/Data_plants.csv")" = "d11b4b45acb13bd9c240b004332e76b09eb6c3e3"
      - name: Audit root foraging, total biomass, and N uptake conditional on plant-source treatments
        shell: bash
        run: |
          python -m benchmarks.score_delory_chemical_legacy \
            --csv "$RUNNER_TEMP/delory/Data_plants.csv" \
            --output "$RUNNER_TEMP/delory/chemical_legacy_aggregate.json"
      - name: Retain ONLY aggregate statistical results, NOT raw data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: delory-chemical-legacy-aggregate-20261124
          path: ${{ runner.temp }}/delory/chemical_legacy_aggregate.json
          retention-days: 14
