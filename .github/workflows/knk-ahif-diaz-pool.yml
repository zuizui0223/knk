name: AHIF Diaz-Colunga independent endpoint pool validation
on:
  push:
    branches: [analysis/ahif-source-context-20261126]
    paths:
      - 'benchmarks/score_ahif_diazcolunga2022_pool.py'
      - '.github/workflows/knk-ahif-diaz-pool.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: python -m benchmarks.score_ahif_diazcolunga2022_pool --out "$RUNNER_TEMP/derived/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: diazcolunga-pool-derived-only
          path: ${{ runner.temp }}/derived/result.json
          retention-days: 30
