name: AHIF independent zooplankton factorial validation
on:
  push:
    branches: [analysis/ahif-independent-dispersal-20261126]
    paths:
      - 'benchmarks/score_ahif_villarreal2025_external.py'
      - '.github/workflows/knk-ahif-villarreal-external.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy openpyxl
      - name: Verify exact raw and author code, score paired clusters
        run: python -m benchmarks.score_ahif_villarreal2025_external --root "$RUNNER_TEMP/villarreal" --out "$RUNNER_TEMP/derived/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: villarreal-external-derived-only
          path: ${{ runner.temp }}/derived/result.json
          retention-days: 30
