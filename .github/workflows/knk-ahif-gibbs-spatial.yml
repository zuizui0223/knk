name: AHIF Gibbs plant spatial transfer
on:
  push:
    branches: [analysis/ahif-spatial-context-transfer-20261127]
    paths:
      - 'benchmarks/score_ahif_gibbs2026_spatial.py'
      - '.github/workflows/knk-ahif-gibbs-spatial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m benchmarks.score_ahif_gibbs2026_spatial --out "$RUNNER_TEMP/derived"
      - uses: actions/upload-artifact@v4
        with:
          name: gibbs-plant-spatial-derived
          path: ${{ runner.temp }}/derived/
          retention-days: 30
