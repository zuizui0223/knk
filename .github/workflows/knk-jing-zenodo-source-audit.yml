name: KNK Jing 2023 original Zenodo source overlap audit

on:
  push:
    branches: [analysis/interaction-formation-20261123]
    paths:
      - ".github/workflows/knk-jing-zenodo-source-audit.yml"
      - "benchmarks/probe_jing_2023_zenodo_possible_overlap.py"
      - "benchmarks/probe_jing_2024_source_xlsx.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-workbook:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original public Zenodo 7856898 files in ephemeral storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jing23"
          curl --fail --location --retry 3 --retry-delay 4 --max-time 180 \
            "https://zenodo.org/records/7856898/files/aboveground%20biomass-Drought%20alters%20soil%20microbiome-mediated%20plant%20coexistence.xlsx?download=1" \
            -o "$RUNNER_TEMP/jing23/source.xlsx"
          curl --fail --location --retry 3 --retry-delay 4 --max-time 100 \
            "https://zenodo.org/records/7856898/files/README.md?download=1" \
            -o "$RUNNER_TEMP/jing23/README.md"
          echo "5afb3a33ad49573aa7e255d2541ab0ed  $RUNNER_TEMP/jing23/source.xlsx" | md5sum -c -
          echo "ae5c5b22981990bdf3a701cd5c7d7393  $RUNNER_TEMP/jing23/README.md" | md5sum -c -
      - name: Source inventory only, block pseudo-replicated ecological scoring
        run: |
          python -m benchmarks.probe_jing_2023_zenodo_possible_overlap \
            --workbook "$RUNNER_TEMP/jing23/source.xlsx" \
            --readme "$RUNNER_TEMP/jing23/README.md" \
            --output "$RUNNER_TEMP/jing23/zenodo_source_schema.json"
      - name: Archive derived schema ONLY (never original XLSX or README)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jing-2023-overlap-schema-audit
          path: ${{ runner.temp }}/jing23/zenodo_source_schema.json
          retention-days: 14
