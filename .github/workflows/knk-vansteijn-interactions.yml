name: KNK published plant competition interaction audit

on:
  push:
    branches: [analysis/interaction-formation-20261123]
    paths:
      - ".github/workflows/knk-vansteijn-interactions.yml"
      - "benchmarks/probe_vansteijn_competition.py"
      - "benchmarks/score_vansteijn_partner_effects.py"
      - "benchmarks/audit_vansteijn_partner_specificity.py"
      - "benchmarks/score_vansteijn_age_matched_neighbor_effect.py"
      - "tests/test_vansteijn_age_matched_neighbor_effect.py"
      - "benchmarks/predict_vansteijn_unseen_neighbor_traits.py"
      - "tests/test_vansteijn_unseen_neighbor_traits.py"
      - "tests/test_vansteijn_partner_specificity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download public original source (ephemeral; hash verified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vansteijn"
          for FILE in alone.csv simultaneous_arrival.csv second_arrival.csv traits.csv R_code.Rmd; do
            curl --fail --location --retry 3 --retry-delay 3 --max-time 90               "https://zenodo.org/records/10512662/files/${FILE}?download=1"               -o "$RUNNER_TEMP/vansteijn/$FILE"
          done
      - name: Install numerical dependencies
        run: python -m pip install numpy
      - name: Validate source-free neighbor specificity under synthetic nulls
        run: |
          python -m pip install pytest
          python -m pytest tests/test_vansteijn_partner_specificity.py tests/test_vansteijn_age_matched_neighbor_effect.py tests/test_vansteijn_unseen_neighbor_traits.py -q
      - name: Inspect primary-source columns, grain, and published analysis
        shell: bash
        run: |
          python -m benchmarks.probe_vansteijn_competition             --source-dir "$RUNNER_TEMP/vansteijn"             --out "$RUNNER_TEMP/vansteijn/schema_audit.json"
      - name: Score directed pair competition and late-arrival matrix
        shell: bash
        run: |
          python -m benchmarks.score_vansteijn_partner_effects \
            --source-dir "$RUNNER_TEMP/vansteijn" \
            --output "$RUNNER_TEMP/vansteijn/pair_response_results.json"
      - name: Audit partner species vs guild identity and influential neighbors
        shell: bash
        run: |
          python -m benchmarks.audit_vansteijn_partner_specificity \
            --source-dir "$RUNNER_TEMP/vansteijn" \
            --output "$RUNNER_TEMP/vansteijn/partner_specificity_results.json"
      - name: Age-matched net neighbor effect, using solo controls
        shell: bash
        run: |
          python -m benchmarks.score_vansteijn_age_matched_neighbor_effect \
            --source-dir "$RUNNER_TEMP/vansteijn" \
            --output "$RUNNER_TEMP/vansteijn/age_matched_net_neighbor_effect.json"
      - name: Transfer prediction to unseen early-neighbor species using morphology
        shell: bash
        run: |
          python -m benchmarks.predict_vansteijn_unseen_neighbor_traits \
            --source-dir "$RUNNER_TEMP/vansteijn" \
            --output "$RUNNER_TEMP/vansteijn/unseen_neighbor_transfer.json" \
            --mapping-permutations 199
      - name: Upload aggregate analysis and schema only (never raw data)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vansteijn-source-schema-20261123
          path: |
            ${{ runner.temp }}/vansteijn/schema_audit.json
            ${{ runner.temp }}/vansteijn/pair_response_results.json
            ${{ runner.temp }}/vansteijn/partner_specificity_results.json
            ${{ runner.temp }}/vansteijn/age_matched_net_neighbor_effect.json
            ${{ runner.temp }}/vansteijn/unseen_neighbor_transfer.json
          retention-days: 14
