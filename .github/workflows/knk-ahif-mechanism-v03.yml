name: AHIF mechanism registry v0.3
on:
  push:
    branches: [analysis/ahif-replication-scale-20261125]
    paths:
      - 'benchmarks/build_ahif_mechanism_registry_v03.py'
      - 'database/ahif_mechanism_v0/replication_scale_effects_20261125.csv'
      - 'validation/ahif_v1/replication_scale_summary_20261125.json'
      - '.github/workflows/knk-ahif-mechanism-v03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m benchmarks.build_ahif_mechanism_registry_v03 --out "$RUNNER_TEMP/registry"
      - uses: actions/upload-artifact@v4
        with:
          name: ahif-mechanism-registry-v03
          path: ${{ runner.temp }}/registry/
          retention-days: 30
