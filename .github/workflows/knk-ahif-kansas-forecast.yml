name: AHIF Kansas direct biomass temporal block forecast
on:
  push:
    branches: [analysis/ahif-db-v1-20261124]
    paths:
      - ".github/workflows/knk-ahif-kansas-forecast.yml"
      - "benchmarks/score_ahif_kansas_forecast.py"
      - "tests/test_ahif_kansas_forecast.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate strict time holdout, partitions and signed scores
        run: |
          python -m pip install numpy pytest
          python -m pytest tests/test_ahif_kansas_forecast.py -q
      - name: Verify source and forecast future block-held species responses
        run: python -m benchmarks.score_ahif_kansas_forecast --root "$RUNNER_TEMP/kansas" --out "$RUNNER_TEMP/kansas/forecast.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ahif-kansas-temporal-forecast-derived-only
          path: ${{ runner.temp }}/kansas/forecast.json
          retention-days: 30
