name: AHIF Diaz-Colunga marker cross-run audit
on:
  push:
    branches: [analysis/ahif-source-context-20261126]
    paths:
      - 'benchmarks/audit_ahif_diazcolunga2022_crossrun.py'
      - '.github/workflows/knk-ahif-diaz-marker-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: python -m benchmarks.audit_ahif_diazcolunga2022_crossrun --out "$RUNNER_TEMP/derived/audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: diazcolunga-marker-audit-only
          path: ${{ runner.temp }}/derived/audit.json
          retention-days: 30
